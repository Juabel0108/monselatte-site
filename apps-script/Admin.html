<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #18201d;
      --forest: #123f35;
      --forest-soft: #dfe9e4;
      --paper: #f6f2e9;
      --cream: #fffdf8;
      --line: #d8d2c6;
      --brass: #a27731;
      --muted: #6f746f;
      --danger: #963b32;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Arial, sans-serif; }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #d2a34e; outline-offset: 2px; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .masthead { background: var(--forest); color: white; padding: 18px clamp(20px, 4vw, 56px); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand strong { font-family: Georgia, serif; font-size: 25px; letter-spacing: -.02em; }
    .brand span { color: #bad0c6; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
    .identity { font-size: 12px; color: #d8e6df; }
    .workspace { display: grid; grid-template-columns: minmax(310px, 38%) 1fr; min-height: 0; }
    .inbox { padding: 28px clamp(18px, 3vw, 38px); border-right: 1px solid var(--line); background: var(--cream); }
    .eyebrow { color: var(--brass); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 6px 0 18px; font: 32px/1.05 Georgia, serif; letter-spacing: -.025em; }
    .search { width: 100%; border: 1px solid var(--line); background: white; border-radius: 2px; padding: 11px 12px; color: var(--ink); }
    .count { margin: 12px 0; color: var(--muted); font-size: 12px; }
    .quote-list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); max-height: calc(100vh - 210px); overflow: auto; }
    .quote-row { appearance: none; border: 0; background: var(--cream); text-align: left; padding: 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; color: inherit; }
    .quote-row:hover, .quote-row[aria-current="true"] { background: #eef3ef; box-shadow: inset 3px 0 var(--forest); }
    .quote-row strong { font-family: Georgia, serif; font-size: 17px; }
    .quote-row small { color: var(--muted); }
    .status { align-self: start; border: 1px solid currentColor; border-radius: 999px; padding: 3px 7px; color: var(--forest); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .status.sent { color: var(--muted); }
    .detail { padding: 34px clamp(24px, 5vw, 70px); overflow: auto; }
    .empty { max-width: 520px; margin-top: 15vh; }
    .empty h2, .detail h2 { font: 34px/1.08 Georgia, serif; margin: 8px 0; }
    .empty p { color: var(--muted); line-height: 1.6; }
    .detail-head { display: flex; justify-content: space-between; align-items: start; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .detail-head p { margin: 5px 0 0; color: var(--muted); }
    .folio { font: 700 13px/1 Arial, sans-serif; color: white; background: var(--forest); padding: 8px 10px; }
    .ledger { margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .field { padding: 13px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.45); }
    .field label { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 5px; }
    .field div { min-height: 18px; overflow-wrap: anywhere; }
    .pricing { margin-top: 26px; border-top: 3px solid var(--forest); }
    .price-row { display: grid; grid-template-columns: 1fr 100px 120px; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); align-items: center; }
    .price-row span:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
    .total { margin: 22px 0 0 auto; width: min(100%, 330px); padding: 18px; background: var(--forest); color: white; display: flex; justify-content: space-between; align-items: baseline; }
    .total span { color: #c9dbd3; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    .total strong { font: 28px Georgia, serif; }
    .editor { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
    .editor h3 { margin: 4px 0 16px; font: 24px/1.1 Georgia, serif; }
    .edit-row { display: grid; grid-template-columns: 1fr 140px 140px; gap: 12px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .edit-row label, .official-total label { display: grid; gap: 5px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .edit-row strong { align-self: center; }
    .edit-row input, .official-total input { width: 100%; border: 1px solid var(--line); background: white; border-radius: 2px; padding: 10px; color: var(--ink); }
    .draft-footer { margin-top: 18px; display: grid; grid-template-columns: 1fr minmax(220px, 330px); gap: 18px; align-items: end; }
    .calculator { padding: 15px 18px; border-left: 3px solid var(--brass); background: #efe7d8; display: flex; justify-content: space-between; align-items: baseline; }
    .calculator span { color: #6e5a38; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .calculator strong { font: 25px Georgia, serif; }
    .save-bar { margin-top: 18px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
    .save-button { border: 0; border-radius: 2px; background: var(--forest); color: white; padding: 12px 18px; font-weight: 800; cursor: pointer; }
    .save-button:hover { background: #0b3028; }
    .save-button:disabled { cursor: wait; opacity: .65; }
    .preview-button { border: 1px solid var(--forest); border-radius: 2px; background: transparent; color: var(--forest); padding: 11px 17px; font-weight: 800; cursor: pointer; }
    .preview-button:hover { background: var(--forest-soft); }
    .preview-button:disabled { cursor: wait; opacity: .6; }
    .preview-link { color: var(--forest); font-weight: 800; }
    .save-status { color: var(--muted); font-size: 12px; }
    .send-panel { margin-top: 24px; padding: 20px; border: 1px solid var(--forest); background: #f0f5f1; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .send-panel strong { display: block; font: 21px/1.15 Georgia, serif; }
    .send-panel p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .send-button { border: 0; border-radius: 2px; background: var(--brass); color: white; padding: 13px 18px; font-weight: 800; white-space: nowrap; cursor: pointer; }
    .send-button:hover { background: #805d26; }
    .send-button:disabled { cursor: wait; opacity: .6; }
    dialog { width: min(92vw, 480px); border: 0; border-top: 5px solid var(--forest); border-radius: 2px; padding: 26px; color: var(--ink); box-shadow: 0 20px 60px rgba(24,32,29,.28); }
    dialog::backdrop { background: rgba(18,34,29,.58); }
    dialog h3 { margin: 5px 0 15px; font: 27px/1.1 Georgia, serif; }
    .confirm-ledger { border-top: 1px solid var(--line); margin: 18px 0; }
    .confirm-line { display: flex; justify-content: space-between; gap: 18px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .confirm-line span { color: var(--muted); font-size: 12px; }
    .confirm-line strong { text-align: right; overflow-wrap: anywhere; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .cancel-button { border: 1px solid var(--line); background: white; color: var(--ink); padding: 11px 15px; cursor: pointer; }
    .notice { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .error { color: var(--danger); background: #fff1ef; border: 1px solid #e8c0bb; padding: 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .masthead { align-items: flex-start; }
      .brand { display: grid; gap: 4px; }
      .workspace { grid-template-columns: 1fr; }
      .inbox { border-right: 0; border-bottom: 1px solid var(--line); }
      .quote-list { max-height: 310px; }
      .detail { padding: 28px 18px 50px; }
    }
    @media (max-width: 520px) {
      .identity { display: none; }
      .ledger { grid-template-columns: 1fr; }
      .price-row { grid-template-columns: 1fr auto; }
      .price-row .quantity { grid-column: 1; color: var(--muted); text-align: left !important; }
      .edit-row { grid-template-columns: 1fr 1fr; }
      .edit-row strong { grid-column: 1 / -1; }
      .draft-footer { grid-template-columns: 1fr; }
      .save-bar { align-items: stretch; flex-direction: column-reverse; }
      .send-panel { align-items: stretch; flex-direction: column; }
      .send-button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><strong>Monselatte</strong><span>Mesa de cotizaciones</span></div>
      <div class="identity" id="identity">Acceso privado</div>
    </header>
    <main class="workspace">
      <aside class="inbox">
        <div class="eyebrow">Operaciones</div>
        <h1>Solicitudes</h1>
        <input class="search" id="search" type="search" placeholder="Buscar nombre, email o número" aria-label="Buscar cotizaciones">
        <div class="count" id="count">Cargando solicitudes…</div>
        <div class="quote-list" id="quoteList" aria-live="polite"></div>
      </aside>
      <section class="detail" id="detail">
        <div class="empty"><div class="eyebrow">Detalle</div><h2>Selecciona una solicitud</h2><p>Aquí verás los datos del evento, los servicios solicitados y el desglose de precios. Esta primera versión es de solo lectura.</p></div>
      </section>
    </main>
  </div>
  <script>
    const state = { quotes: [], selected: null };
    const moneyFields = [
      ['Barra de café', '', 'precio_barra'],
      ['Bebidas frías', 'cantidad_bebidas_frias', 'precio_bebidas_frias'],
      ['Matcha', 'cantidad_matcha', 'precio_matcha'],
      ['Espresso martini', 'cantidad_espresso_martini', 'precio_espresso_martini'],
      ['Carajillo', 'cantidad_carajillo', 'precio_carajillo']
    ];
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const money = value => {
      const normalized = String(value ?? '').replace(/[^0-9.-]/g, '');
      if (!normalized) return '—';
      const amount = Number(normalized);
      return Number.isFinite(amount) ? amount.toLocaleString('en-US', { style: 'currency', currency: 'USD' }) : '—';
    };
    function renderList(filter = '') {
      const query = filter.trim().toLowerCase();
      const quotes = state.quotes.filter(q => [q.nombre, q.email, q.nro].join(' ').toLowerCase().includes(query));
      document.getElementById('count').textContent = `${quotes.length} solicitud${quotes.length === 1 ? '' : 'es'}`;
      document.getElementById('quoteList').innerHTML = quotes.map(q => `
        <button class="quote-row" data-row="${q.sheetRow}" aria-current="${state.selected?.sheetRow === q.sheetRow}">
          <strong>${escapeHtml(q.nombre || 'Sin nombre')}</strong><span class="status ${q.status === 'Enviada' ? 'sent' : ''}">${escapeHtml(q.status)}</span>
          <small>${escapeHtml(q.nro || q.fecha || 'Sin número')}</small><small>${escapeHtml(q.localidad)}</small>
        </button>`).join('') || '<div class="quote-row"><small>No hay resultados.</small></div>';
      document.querySelectorAll('[data-row]').forEach(button => button.addEventListener('click', () => selectQuote(Number(button.dataset.row))));
    }
    function selectQuote(row) {
      state.selected = state.quotes.find(q => q.sheetRow === row);
      renderList(document.getElementById('search').value);
      renderDetail(state.selected);
    }
    function renderDetail(q) {
      if (!q) return;
      const fields = [['Fecha',q.fecha],['Horario',[q.hora_inicio,q.hora_fin].filter(Boolean).join(' – ')],['Municipio',q.localidad],['Dirección',q.direccion],['Evento',q.tipo],['Invitados',q.invitados],['Email',q.email],['Teléfono',q.telefono]];
      const priceRows = moneyFields.filter(([, qty, price]) => q[qty] || q[price]).map(([label, qty, price]) => `<div class="price-row"><strong>${label}</strong><span class="quantity">${escapeHtml(q[qty] || (label === 'Barra de café' ? `${q.invitados || '—'} invitados` : '—'))}</span><span>${money(q[price])}</span></div>`).join('');
      const requested = moneyFields.filter(([label]) => label === 'Barra de café' || (label === 'Bebidas frías' && q.menu_frias) || (label === 'Matcha' && q.menu_matcha) || (label === 'Espresso martini' && String(q.menu_licor).includes('Espresso martini')) || (label === 'Carajillo' && String(q.menu_licor).includes('Carajillo')));
      const editRows = requested.map(([label, qty, price]) => `<div class="edit-row"><strong>${label}</strong>${qty ? `<label>Cantidad<input type="number" min="0" step="1" inputmode="numeric" data-field="${qty}" value="${escapeHtml(q[qty])}"></label>` : '<span></span>'}<label>Precio<input type="number" min="0" step="0.01" inputmode="decimal" data-field="${price}" data-price value="${escapeHtml(q[price])}"></label></div>`).join('');
      document.getElementById('detail').innerHTML = `
        <div class="detail-head"><div><div class="eyebrow">${escapeHtml(q.status)}</div><h2>${escapeHtml(q.nombre || 'Sin nombre')}</h2><p>${escapeHtml(q.email)}</p></div><div class="folio">${escapeHtml(q.nro || 'SIN NÚMERO')}</div></div>
        <div class="ledger">${fields.map(([label,value]) => `<div class="field"><label>${label}</label><div>${escapeHtml(value || '—')}</div></div>`).join('')}</div>
        <div class="pricing">${priceRows || '<div class="price-row"><span>Aún no hay precios preparados.</span></div>'}</div>
        <div class="total"><span>Total oficial</span><strong>${money(q.precio)}</strong></div>
        <section class="editor"><div class="eyebrow">Borrador</div><h3>Preparar precios</h3>${editRows}
          <div class="draft-footer"><label class="official-total">Total oficial<input type="number" min="0" step="0.01" inputmode="decimal" data-field="precio" value="${escapeHtml(q.precio)}"><span class="notice">Se escribe manualmente; la calculadora no lo reemplaza.</span></label><div class="calculator"><span>Suma de precios</span><strong id="calculatedTotal">—</strong></div></div>
          <div class="save-bar"><span class="save-status" id="saveStatus">Guardar o previsualizar no envía la cotización.</span><button class="preview-button" id="previewQuote" type="button">Generar vista previa</button><button class="save-button" id="saveDraft" type="button">Guardar borrador</button></div>
          <div class="send-panel"><div><strong>${q.sent_at ? 'Enviar una actualización' : 'Entregar cotización'}</strong><p>Se generará el PDF, se enviará a ${escapeHtml(q.email || 'sin destinatario')} y se registrará la fecha.</p></div><button class="send-button" id="sendQuote" type="button">${q.sent_at ? 'Generar PDF y reenviar' : 'Generar PDF y enviar'}</button></div>
        </section>`;
      attachDraftEvents(q);
    }
    function attachDraftEvents(q) {
      const inputs = [...document.querySelectorAll('[data-field]')];
      let dirty = false;
      const calculate = () => {
        const sum = [...document.querySelectorAll('[data-price]')].reduce((total, input) => total + (Number(input.value) || 0), 0);
        document.getElementById('calculatedTotal').textContent = money(sum);
      };
      inputs.forEach(input => input.addEventListener('input', () => { dirty = true; calculate(); }));
      calculate();
      document.getElementById('saveDraft').addEventListener('click', () => {
        const button = document.getElementById('saveDraft');
        const status = document.getElementById('saveStatus');
        const changes = Object.fromEntries(inputs.map(input => [input.dataset.field, input.value]));
        button.disabled = true;
        status.textContent = 'Guardando…';
        google.script.run.withSuccessHandler(result => {
          Object.assign(q, result.values || {});
          renderDetail(q);
          document.getElementById('saveStatus').textContent = 'Borrador guardado. No se envió ningún correo.';
        }).withFailureHandler(error => {
          button.disabled = false;
          status.textContent = error?.message || String(error);
        }).saveAdminQuoteDraft({ sheetRow: q.sheetRow, expectedNro: q.nro, expectedEmail: q.email, changes });
      });
      document.getElementById('previewQuote').addEventListener('click', () => {
        const button = document.getElementById('previewQuote');
        const status = document.getElementById('saveStatus');
        if (dirty) { status.textContent = 'Guarda el borrador antes de generar la vista previa.'; return; }
        button.disabled = true;
        status.textContent = 'Generando PDF…';
        google.script.run.withSuccessHandler(result => {
          button.disabled = false;
          status.innerHTML = `Vista previa creada. <a class="preview-link" href="${escapeHtml(result.url)}" target="_blank" rel="noopener">Abrir PDF</a>`;
        }).withFailureHandler(error => {
          button.disabled = false;
          status.textContent = error?.message || String(error);
        }).previewAdminQuote({ sheetRow: q.sheetRow, expectedNro: q.nro, expectedEmail: q.email });
      });
      document.getElementById('sendQuote').addEventListener('click', () => {
        const status = document.getElementById('saveStatus');
        if (dirty) { status.textContent = 'Guarda el borrador antes de enviar.'; return; }
        if (!q.email) { status.textContent = 'Esta cotización no tiene email de destinatario.'; return; }
        if (String(q.precio ?? '').trim() === '') { status.textContent = 'Escribe y guarda el total oficial antes de enviar.'; return; }
        openSendConfirmation(q);
      });
    }
    function openSendConfirmation(q) {
      const dialog = document.createElement('dialog');
      const isUpdate = Boolean(q.sent_at);
      dialog.innerHTML = `<div class="eyebrow">Confirmación final</div><h3>${isUpdate ? '¿Enviar esta actualización?' : '¿Enviar esta cotización?'}</h3><p>Esta acción enviará un correo real al cliente.</p><div class="confirm-ledger"><div class="confirm-line"><span>Cliente</span><strong>${escapeHtml(q.nombre || 'Sin nombre')}</strong></div><div class="confirm-line"><span>Destinatario</span><strong>${escapeHtml(q.email)}</strong></div><div class="confirm-line"><span>Total oficial</span><strong>${money(q.precio)}</strong></div><div class="confirm-line"><span>Cotización</span><strong>${escapeHtml(q.nro || 'Se asignará al enviar')}</strong></div></div><div class="dialog-actions"><button class="cancel-button" type="button">Cancelar</button><button class="send-button" type="button">Sí, generar y ${isUpdate ? 'reenviar' : 'enviar'}</button></div>`;
      document.body.appendChild(dialog);
      dialog.querySelector('.cancel-button').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => dialog.remove());
      dialog.querySelector('.send-button').addEventListener('click', () => executeSend(q, dialog, isUpdate));
      dialog.showModal();
    }
    function executeSend(q, dialog, isUpdate) {
      const confirmButton = dialog.querySelector('.send-button');
      const cancelButton = dialog.querySelector('.cancel-button');
      const status = document.getElementById('saveStatus');
      confirmButton.disabled = true;
      cancelButton.disabled = true;
      confirmButton.textContent = 'Enviando…';
      status.textContent = 'Generando PDF y enviando correo…';
      google.script.run.withSuccessHandler(result => {
        Object.assign(q, { nro: result.quoteNumber, pdfurl: result.pdfUrl, sent_at: result.sentAt, status: 'Enviada' });
        dialog.close();
        renderList(document.getElementById('search').value);
        renderDetail(q);
        document.getElementById('saveStatus').innerHTML = `Correo enviado a ${escapeHtml(result.recipient)}. <a class="preview-link" href="${escapeHtml(result.pdfUrl)}" target="_blank" rel="noopener">Abrir PDF</a>`;
      }).withFailureHandler(error => {
        confirmButton.disabled = false;
        cancelButton.disabled = false;
        confirmButton.textContent = `Intentar ${isUpdate ? 'reenviar' : 'enviar'} nuevamente`;
        status.textContent = error?.message || String(error);
      }).sendAdminQuote({ sheetRow: q.sheetRow, expectedNro: q.nro, expectedEmail: q.email, confirmResend: isUpdate });
    }
    function showError(error) {
      document.getElementById('count').textContent = 'No se pudo cargar';
      document.getElementById('detail').innerHTML = `<div class="error"><strong>No se pudieron cargar las solicitudes.</strong><br>${escapeHtml(error?.message || error)}</div>`;
    }
    document.getElementById('search').addEventListener('input', event => renderList(event.target.value));
    function loadInbox(data) {
        state.quotes = data.quotes || [];
        document.getElementById('identity').textContent = data.adminEmail;
        renderList();
        if (state.quotes[0]) selectQuote(state.quotes[0].sheetRow);
    }
    if (typeof google !== 'undefined' && google.script?.run) {
      google.script.run.withSuccessHandler(loadInbox).withFailureHandler(showError).getAdminQuoteInbox();
    } else {
      loadInbox({
        adminEmail: 'Vista de demostración',
        quotes: [
          { sheetRow: 3, status: 'Nueva', nombre: 'María Rivera', email: 'maria@example.com', telefono: '(787) 555-0142', nro: '', fecha: '18 oct 2026', hora_inicio: '4:00 PM', hora_fin: '7:00 PM', localidad: 'San Juan', direccion: 'Museo de Arte', tipo: 'Boda', invitados: '120', precio: '' },
          { sheetRow: 2, status: 'Lista para enviar', nombre: 'Estudio Laurel', email: 'eventos@example.com', telefono: '(787) 555-0188', nro: 'ML-2610-014', fecha: '24 oct 2026', hora_inicio: '9:00 AM', hora_fin: '12:00 PM', localidad: 'Dorado', direccion: 'Salón principal', tipo: 'Corporativo', invitados: '85', precio_barra: '500', cantidad_matcha: '40 bebidas', precio_matcha: '80', cantidad_carajillo: '30 bebidas', precio_carajillo: '210', precio: '790' },
          { sheetRow: 1, status: 'Enviada', nombre: 'Andrea & Luis', email: 'andrea@example.com', telefono: '(787) 555-0199', nro: 'ML-2610-011', fecha: '10 oct 2026', hora_inicio: '5:30 PM', hora_fin: '8:30 PM', localidad: 'Rincón', direccion: 'Hacienda Vista Mar', tipo: 'Boda', invitados: '100', precio_barra: '500', cantidad_bebidas_frias: '50 bebidas', precio_bebidas_frias: '75', precio: '575' }
        ]
      });
    }
  </script>
</body>
</html>
